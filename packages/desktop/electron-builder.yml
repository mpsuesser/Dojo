appId: app.dojo.desktop
productName: Dojo
directories:
  output: release
files:
  - dist/**
  - assets/icon.png
  - package.json
extraResources:
  - from: ../app/dist
    to: app
mac:
  target: dmg
  identity: null
  icon: assets/icon.icns
win:
  target: nsis
  icon: assets/icon.ico
linux:
  target: AppImage
  icon: assets/icon.png
npmRebuild: false

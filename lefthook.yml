pre-commit:
  piped: true
  jobs:
    - name: format
      run: bun run format
      stage_fixed: true
    - group:
        parallel: true
        jobs:
          - name: lint
            run: bun run lint
          - name: typecheck
            run: bun run typecheck

pre-push:
  commands:
    check:
      run: bun run check
